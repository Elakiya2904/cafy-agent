[project]
name = "cafy-agent"
version = "0.1.0"
description = "Cafy Agent backend: FastAPI API with ATS scrapers, job matching and resume tailoring."
readme = "README.md"
# Same version as the Docker image; uv installs it automatically (see .python-version).
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    # Required by pydantic's EmailStr (backend/custom_auth.py); without it the API fails to import on Vercel.
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "truststore>=0.10.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "Jinja2>=3.1.0",
    "aiohttp>=3.9.0",
    "openpyxl>=3.1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9",
    "cryptography>=42.0",
    "PyJWT[crypto]>=2.8",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
# Installed by `uv sync` for local development; never shipped (requirements.txt and Docker skip it).
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
# An application, not a library: uv manages the environment but does not build/install the project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
